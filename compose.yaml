services:
  app:
    build:
      context: .
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci
        COPY . .
        RUN npm run build
        ENV NODE_ENV=production
        ENV PORT=8787
        EXPOSE 8787
        CMD ["npm", "start"]
    image: whats-for-dinner:latest
    container_name: whats-for-dinner
    restart: unless-stopped
    environment:
      PORT: "8787"
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    networks:
      - homelab_net
    labels:
      caddy: whatsfordinner.local.lan
      caddy.tls: internal
      caddy.reverse_proxy: whats-for-dinner:8787

networks:
  homelab_net:
    external: true
