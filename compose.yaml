services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whats-for-dinner-app
    restart: unless-stopped
    environment:
      PORT: "8787"
    volumes:
      - ./data:/app/data

  caddy:
    image: caddy:2-alpine
    container_name: whats-for-dinner-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
